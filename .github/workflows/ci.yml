name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
      - name: Manifest and locale tests
        run: node --test tests/manifest.test.mjs
      - name: Package metadata sanity
        run: node scripts/healthcheck.mjs --offline

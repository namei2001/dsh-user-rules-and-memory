<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="-apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161d2a"/>
      <stop offset="1" stop-color="#0d121b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FA8FF"/>
      <stop offset="1" stop-color="#3D6FE0"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B79BFF"/>
      <stop offset="1" stop-color="#7255D9"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FD8A0"/>
      <stop offset="1" stop-color="#29B27B"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="720" height="380" rx="20" fill="url(#bg)"/>

  <!-- title -->
  <text x="360" y="40" text-anchor="middle" font-size="19" font-weight="700" fill="#E8EEFF">How rules and memories reach the agent</text>

  <!-- ===== RULES column ===== -->
  <g>
    <rect x="36" y="66" width="316" height="252" rx="16" fill="#1C2A44" fill-opacity="0.75" stroke="url(#blue)" stroke-width="1.6"/>
    <rect x="36" y="66" width="316" height="44" rx="16" fill="url(#blue)" fill-opacity="0.20"/>
    <text x="56" y="94" font-size="16" font-weight="700" fill="#CFE0FF">RULES · hard constraints</text>

    <text x="56" y="138" font-size="13" fill="#9DB6E8">“from now on / always / write to config”</text>

    <!-- the stored rule -->
    <rect x="56" y="152" width="276" height="40" rx="10" fill="#243A5E" stroke="#4E79D6" stroke-width="1"/>
    <text x="70" y="177" font-size="13.5" fill="#DCE8FF">“All replies in English”</text>

    <!-- always injected arrow -->
    <path d="M194 192 L194 226" stroke="url(#blue)" stroke-width="2" marker-end="url(#arrBlue)"/>
    <defs>
      <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
        <path d="M1 1 L5 8 L9 1" fill="none" stroke="#6C9BFF" stroke-width="1.6" stroke-linecap="round"/>
      </marker>
    </defs>
    <text x="194" y="212" text-anchor="middle" font-size="11.5" fill="#8FB0F0">every session</text>

    <!-- system prompt box -->
    <rect x="96" y="234" width="196" height="42" rx="10" fill="#2A3E66" stroke="url(#blue)" stroke-width="1.4"/>
    <text x="194" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="#EAF1FF">injected into system prompt</text>

    <text x="194" y="300" text-anchor="middle" font-size="12" fill="#7F97C4">→ always in context, no lookup needed</text>
  </g>

  <!-- ===== MEMORY column ===== -->
  <g>
    <rect x="368" y="66" width="316" height="252" rx="16" fill="#2A2344" fill-opacity="0.75" stroke="url(#purple)" stroke-width="1.6"/>
    <rect x="368" y="66" width="316" height="44" rx="16" fill="url(#purple)" fill-opacity="0.20"/>
    <text x="388" y="94" font-size="16" font-weight="700" fill="#E4D9FF">MEMORY · soft notes</text>

    <text x="388" y="138" font-size="13" fill="#C0B2EC">“remember X”</text>

    <!-- the stored memory -->
    <rect x="388" y="152" width="276" height="40" rx="10" fill="#3A3060" stroke="#8E74DE" stroke-width="1"/>
    <text x="402" y="177" font-size="13.5" fill="#EDE5FF">“User prefers dark theme”</text>

    <!-- index-only arrow -->
    <path d="M526 192 L526 226" stroke="url(#purple)" stroke-width="2" marker-end="url(#arrPurple)"/>
    <defs>
      <marker id="arrPurple" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
        <path d="M1 1 L5 8 L9 1" fill="none" stroke="#A98BFF" stroke-width="1.6" stroke-linecap="round"/>
      </marker>
    </defs>
    <text x="526" y="212" text-anchor="middle" font-size="11.5" fill="#C0A6F5">index only</text>

    <!-- system prompt box -->
    <rect x="428" y="234" width="196" height="42" rx="10" fill="#443270" stroke="url(#purple)" stroke-width="1.4"/>
    <text x="526" y="260" text-anchor="middle" font-size="13" font-weight="600" fill="#F3ECFF">one-line index injected</text>

    <text x="526" y="300" text-anchor="middle" font-size="12" fill="#AC9BD4">→ full text fetched via recall when relevant</text>
  </g>

  <!-- ===== bottom: scope strip ===== -->
  <g>
    <rect x="36" y="334" width="648" height="32" rx="16" fill="#1B2540" stroke="#3D5A94" stroke-width="1.2"/>
    <!-- globe icon -->
    <circle cx="76" cy="350" r="9" fill="none" stroke="#7FA8FF" stroke-width="1.6"/>
    <path d="M67 350h18M76 341c5 5 5 13 0 18M76 341c-5 5-5 13 0 18" fill="none" stroke="#7FA8FF" stroke-width="1.2"/>
    <text x="96" y="355" font-size="12.5" fill="#B9C8E8">Global · all projects</text>
    <!-- divider -->
    <line x1="252" y1="342" x2="252" y2="358" stroke="#3D5A94" stroke-width="1"/>
    <!-- folder icon -->
    <path d="M276 345h11l3 3h10v10a2 2 0 0 1-2 2h-22a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z" fill="none" stroke="#7FA8FF" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="308" y="355" font-size="12.5" fill="#B9C8E8">Project · one project only</text>
    <line x1="470" y1="342" x2="470" y2="358" stroke="#3D5A94" stroke-width="1"/>
    <!-- check icon -->
    <circle cx="498" cy="350" r="9" fill="url(#green)"/>
    <path d="M494.3 350l2.5 2.5 4-4.5" fill="none" stroke="#0d121b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="518" y="355" font-size="12.5" fill="#A6DCC2">Both support user / project scope</text>
  </g>
</svg>

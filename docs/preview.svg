<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="-apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161d2a"/>
      <stop offset="1" stop-color="#0d121b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FA8FF"/>
      <stop offset="1" stop-color="#3D6FE0"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B79BFF"/>
      <stop offset="1" stop-color="#7255D9"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="760" height="400" rx="20" fill="url(#bg)"/>

  <!-- title -->
  <text x="380" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#E8EEFF">How rules and memories reach the agent</text>

  <!-- ===================== RULES CARD ===================== -->
  <rect x="40" y="72" width="330" height="248" rx="16" fill="#1C2A44" fill-opacity="0.75" stroke="url(#blue)" stroke-width="1.6"/>
  <!-- header with only top corners rounded -->
  <path d="M56 72 H354 A16 16 0 0 1 370 88 V114 H40 V88 A16 16 0 0 1 56 72 Z" fill="url(#blue)" fill-opacity="0.22"/>
  <text x="60" y="100" font-size="15.5" font-weight="700" fill="#CFE0FF">RULES · hard constraints</text>

  <text x="60" y="141" font-size="12.5" fill="#9DB6E8">Trigger: "from now on", "always"</text>
  <rect x="58" y="153" width="294" height="38" rx="9" fill="#243A5E" stroke="#4E79D6" stroke-width="1"/>
  <text x="205" y="177" text-anchor="middle" font-size="13.5" fill="#DCE8FF">"All replies in English"</text>

  <!-- explicit arrow (no marker) + label to the side -->
  <line x1="205" y1="192" x2="205" y2="209" stroke="#6C9BFF" stroke-width="2"/>
  <polygon points="199,208 211,208 205,218" fill="#6C9BFF"/>
  <text x="223" y="208" font-size="11" fill="#8FB0F0">every session</text>

  <rect x="100" y="226" width="210" height="40" rx="10" fill="#2A3E66" stroke="url(#blue)" stroke-width="1.4"/>
  <text x="205" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#EAF1FF">Injected into every prompt</text>
  <text x="205" y="294" text-anchor="middle" font-size="12" fill="#7F97C4">Always in context · no lookup</text>

  <!-- ===================== MEMORY CARD ===================== -->
  <rect x="390" y="72" width="330" height="248" rx="16" fill="#2A2344" fill-opacity="0.75" stroke="url(#purple)" stroke-width="1.6"/>
  <path d="M406 72 H704 A16 16 0 0 1 720 88 V114 H390 V88 A16 16 0 0 1 406 72 Z" fill="url(#purple)" fill-opacity="0.22"/>
  <text x="410" y="100" font-size="15.5" font-weight="700" fill="#E4D9FF">MEMORY · soft notes</text>

  <text x="410" y="141" font-size="12.5" fill="#C0B2EC">Trigger: "remember X"</text>
  <rect x="408" y="153" width="294" height="38" rx="9" fill="#3A3060" stroke="#8E74DE" stroke-width="1"/>
  <text x="555" y="177" text-anchor="middle" font-size="13.5" fill="#EDE5FF">"User prefers dark theme"</text>

  <!-- explicit arrow (no marker) + label to the side -->
  <line x1="555" y1="192" x2="555" y2="209" stroke="#A98BFF" stroke-width="2"/>
  <polygon points="549,208 561,208 555,218" fill="#A98BFF"/>
  <text x="573" y="208" font-size="11" fill="#C0A6F5">index only</text>

  <rect x="450" y="226" width="210" height="40" rx="10" fill="#443270" stroke="url(#purple)" stroke-width="1.4"/>
  <text x="555" y="252" text-anchor="middle" font-size="13" font-weight="600" fill="#F3ECFF">Only a one-line index</text>
  <text x="555" y="294" text-anchor="middle" font-size="12" fill="#AC9BD4">Full text via recall when relevant</text>

  <!-- ===================== SCOPE PILLS ===================== -->
  <!-- Global -->
  <rect x="40" y="338" width="224" height="34" rx="17" fill="#1B2740" stroke="#3D5A94" stroke-width="1.2"/>
  <circle cx="62" cy="355" r="9" fill="none" stroke="#7FA8FF" stroke-width="1.6"/>
  <path d="M53 355h18M62 346c5 5 5 13 0 18M62 346c-5 5-5 13 0 18" fill="none" stroke="#7FA8FF" stroke-width="1.1"/>
  <text x="82" y="360" font-size="12.5" fill="#B9C8E8">Global · all projects</text>

  <!-- Project -->
  <rect x="274" y="338" width="224" height="34" rx="17" fill="#1B2740" stroke="#3D5A94" stroke-width="1.2"/>
  <path d="M288 349h11l3 3h10v10a2 2 0 0 1-2 2h-22a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z" fill="none" stroke="#7FA8FF" stroke-width="1.6" stroke-linejoin="round"/>
  <text x="316" y="360" font-size="12.5" fill="#B9C8E8">Project · one project</text>

  <!-- Both scopes -->
  <rect x="508" y="338" width="212" height="34" rx="17" fill="#1E2A1F" stroke="#2F8F63" stroke-width="1.2"/>
  <circle cx="530" cy="355" r="9" fill="#3FB57D"/>
  <path d="M526 355l2.8 2.8 4.7-5.2" fill="none" stroke="#0d121b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="550" y="360" font-size="12.5" fill="#A6DCC2">Both scopes supported</text>
</svg>
